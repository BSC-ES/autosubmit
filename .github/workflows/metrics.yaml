name: metrics

# This workflow benchmarks Autosubmit performance and keeps a baseline of the
# "last known good" results on the `benchmark-reference` branch.
#
# Trigger modes:
#   * PR gate: on every pull_request the `metrics` job runs as a REQUIRED
#     status check. It is a cheap no-op unless the PR has the
#     `perf-benchmark` label (which needs write/triage access to add), in which
#     case it runs the FULL suite (`profilelong`) against the baseline and greys
#     the merge button until the check completes. While the label is on, every
#     push triggers a full run (~20 min) and the `benchmark` concurrency group
#     serializes them, so remove the label once the check passes to avoid
#     queueing extra runs.
#   * Manual: a maintainer (member of the BSC-ES/autosubmit team, or listed in
#     .benchmarks/allowed-users.txt on the default branch) comments on a PR:
#       - `/metrics`          quick suite
#       - `/metrics_full`     full suite (adds the 4m/2c/4s and 4m/2c/8s run scenarios)
#       - `/metrics_promote`  promote the last completed run as the new
#                             baseline.
#
# Baseline promotion is GUARDED: a run that regresses vs the current baseline
# is never promoted, so the baseline cannot ratchet downward. Set up branch
# protection on the default branch to require the `performance-benchmark` check
# (Settings > Branches > Require status checks).
#
# NOTE: `issue_comment` workflows run the version of this file on the DEFAULT
# branch, not the PR head. Changes here only take effect after merging.
# NOTE: the authorization allowlist is read from .benchmarks/allowed-users.txt on the
# default branch (currently `master`) on purpose, so PRs cannot self-authorize.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# Only one benchmark workflow at a time: concurrent runs would race when
# pushing the baseline branch.
concurrency:
  group: benchmark
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  # How many times the benchmark suite is run per workflow invocation; the
  # sessions are merged into a single file (per-scenario medians) before the
  # artifact upload.
  BENCHMARK_RUNS: 3

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Check the comment author is allowed
        id: auth
        uses: actions/github-script@v9
        env:
          ACT: ${{ env.ACT }}
        with:
          script: |
            // PR-gate runs are authorized by the label itself; only the manual
            // comment commands need this check.
            if (context.eventName !== 'issue_comment') {
              core.setOutput('allowed', 'true');
              return;
            }
            // Local `act` runs must not hit the org-level APIs.
            if (process.env.ACT) {
              core.setOutput('allowed', 'true');
              return;
            }
            const username = context.payload.comment.user.login;
            let allowed = false;
            // (1) Members of the BSC-ES/autosubmit team are allowed.
            try {
              await github.rest.teams.getMembershipForUserInOrg({
                org: 'BSC-ES',
                team_slug: 'autosubmit',
                username,
              });
              allowed = true;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            // (2) Users listed in .benchmarks/allowed-users.txt on the default branch.
            if (!allowed) {
              try {
                const { data: repoInfo } = await github.rest.repos.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: '.benchmarks/allowed-users.txt',
                  ref: repoInfo.default_branch,
                });
                const text = Buffer.from(data.content, 'base64').toString();
                allowed = new RegExp(`@${username}\\b`).test(text);
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
            core.setOutput('allowed', String(allowed));

  metrics:
    name: performance-benchmark
    needs: authorize
    if: >
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        needs.authorize.outputs.allowed == 'true' &&
        contains(github.event.comment.body, '/metrics')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      version: ${{ steps.as_version.outputs.version }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      issue_number: ${{ steps.pr.outputs.issue_number }}
      test_type: ${{ steps.scope.outputs.test_type }}
      should_run: ${{ steps.scope.outputs.should_run }}
      promote_last: ${{ steps.scope.outputs.promote_last }}

    steps:
      - name: Check for the perf-benchmark label
        id: label
        uses: actions/github-script@v9
        with:
          script: |
            // Fetch the live label state from the API instead of trusting the
            // event payload: GitHub's `labeled` webhook payload can be stale or
            // miss the label that was just added, which silently turns off the
            // whole benchmark/report/baseline chain.
            if (context.eventName === 'pull_request') {
              const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
              });
              core.setOutput('label_present',
                labels.some((l) => l.name === 'perf-benchmark') ? 'true' : 'false');
            } else {
              core.setOutput('label_present', 'false');
            }

      - name: Get PR / commit info
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              core.setOutput('head_repo', pr.data.head.repo.full_name);
              core.setOutput('head_ref', pr.data.head.ref);
              core.setOutput('head_sha', pr.data.head.sha);
              core.setOutput('issue_number', String(context.issue.number));
            } else {
              core.setOutput('head_repo', context.payload.pull_request.head.repo.full_name);
              core.setOutput('head_ref', context.payload.pull_request.head.ref);
              core.setOutput('head_sha', context.payload.pull_request.head.sha);
              core.setOutput('issue_number', String(context.payload.pull_request.number));
            }

      - name: Determine benchmark scope
        id: scope
        run: |
          # Suite: full on the PR label gate and /metrics_full, quick on /metrics.
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "test_type=profilelong" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "issue_comment" ] && \
               [[ "${{ github.event.comment.body }}" == *"/metrics_full"* ]]; then
            echo "test_type=profilelong" >> "$GITHUB_OUTPUT"
          else
            echo "test_type=profile" >> "$GITHUB_OUTPUT"
          fi
          # Promote the last completed run without re-running: /metrics_promote.
          if [ "${{ github.event_name }}" == "issue_comment" ] && \
             [[ "${{ github.event.comment.body }}" == *"/metrics_promote"* ]]; then
            echo "promote_last=true" >> "$GITHUB_OUTPUT"
          else
            echo "promote_last=false" >> "$GITHUB_OUTPUT"
          fi
          # Run the benchmark for labeled PRs and for manual commands, except
          # /metrics_promote which only re-baselines the last run.
          if [ "${{ github.event_name }}" == "issue_comment" ] && \
             [[ "${{ github.event.comment.body }}" == *"/metrics_promote"* ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.label.outputs.label_present }}" == "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post benchmark started
        id: started
        if: steps.scope.outputs.should_run == 'true' && !env.ACT
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number('${{ steps.pr.outputs.issue_number }}');
            // Remove any leftover progress notices from previous runs so they
            // never accumulate (self-heal after failed or interrupted runs).
            const stale = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            for (const c of stale.filter((c) => c.body.startsWith('> **Benchmark status:**'))) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
            }
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data } = await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `> **Benchmark status:** started - [follow the run](${runUrl})`
            });
            core.setOutput('comment_id', String(data.id));

      - name: Checkout code
        if: steps.scope.outputs.should_run == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Get Autosubmit version
        id: as_version
        if: steps.scope.outputs.should_run == 'true'
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.scope.outputs.should_run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        if: steps.scope.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]

      - name: Fetch baseline results
        id: baseline
        if: steps.scope.outputs.should_run == 'true'
        run: |
          git remote add base "https://github.com/${{ github.repository }}.git"
          git fetch base benchmark-reference --depth 1 || echo "no baseline branch yet"
          if git cat-file -e refs/remotes/base/benchmark-reference:.benchmarks/reference 2>/dev/null; then
            git checkout refs/remotes/base/benchmark-reference -- .benchmarks/reference
            echo "Using baseline from benchmark-reference branch"
          else
            echo "No baseline found, running without comparison"
          fi
          mkdir -p .benchmarks/reference

      - name: Run benchmarks
        if: steps.scope.outputs.should_run == 'true'
        run: |
          short_sha=$(echo "${{ steps.pr.outputs.head_sha }}" | cut -c1-7)
          for i in $(seq 1 "${BENCHMARK_RUNS:-3}"); do
            args=(
              -m "${{ steps.scope.outputs.test_type }}"
              -n 0
              --benchmark-storage=file://.benchmarks/data
              --benchmark-save="${{ steps.as_version.outputs.version }}-${short_sha}-run${i}"
              test/integration/commands/test_performance.py
            )
            # BENCHMARK_K is only set when running the workflow locally with act
            # (e.g. -k create) to avoid the Docker-in-Docker slurm scenarios.
            if [ -n "${BENCHMARK_K:-}" ]; then
              args+=( -k "$BENCHMARK_K" )
            fi
            pytest "${args[@]}"
          done
          # Merge the BENCHMARK_RUNS sessions into a single file with
          # per-scenario medians, then drop the raw session files (pytest
          # stores them with a counter prefix, hence the find): the artifact
          # holds exactly one file per run.
          python .benchmarks/merge_runs.py \
            --input .benchmarks/data \
            --output ".benchmarks/data/${{ steps.as_version.outputs.version }}-${short_sha}.json"
          find .benchmarks/data -name '*.json' \
            ! -name "${{ steps.as_version.outputs.version }}-${short_sha}.json" -delete

      - name: Upload benchmark artifacts
        if: steps.scope.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: performance-metrics-${{ steps.as_version.outputs.version }}
          path: |
            .benchmarks/data
            .benchmarks/reference
          retention-days: 7

      - name: Post benchmark failed
        if: always() && failure() && steps.started.outputs.comment_id && !env.ACT
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const comment_id = Number('${{ steps.started.outputs.comment_id }}');
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.updateComment({
              owner, repo, comment_id,
              body: `> **Benchmark status:** failed - [follow the run](${runUrl})`
            });

  report:
    needs: metrics
    if: always() && needs.metrics.result == 'success' && needs.metrics.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      regressions_detected: ${{ steps.verdict.outputs.regressions_detected }}
      cpu_slug: ${{ steps.verdict.outputs.cpu_slug }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.metrics.outputs.head_repo }}
          ref: ${{ needs.metrics.outputs.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v8
        with:
          name: performance-metrics-${{ needs.metrics.outputs.version }}
          path: .benchmarks

      - name: Generate comparison report
        run: |
          python .benchmarks/compare_results.py \
            --current .benchmarks/data \
            --previous .benchmarks/reference \
            --thresholds .benchmarks/thresholds.yml \
            --version "${{ needs.metrics.outputs.version }}" \
            --current-label "PR #${{ needs.metrics.outputs.issue_number }} (${{ needs.metrics.outputs.head_sha }})" \
            --previous-label "master baseline" \
            --output-dir .benchmarks/artifacts

      - name: Read comparison verdict
        id: verdict
        run: |
          jq -r '.regressions_detected' \
            .benchmarks/artifacts/report_${{ needs.metrics.outputs.version }}.json \
            | { read v; echo "regressions_detected=$v" >> "$GITHUB_OUTPUT"; }
          jq -r '.cpu_slug' \
            .benchmarks/artifacts/report_${{ needs.metrics.outputs.version }}.json \
            | { read v; echo "cpu_slug=$v" >> "$GITHUB_OUTPUT"; }

      - name: Upload report artifacts
        uses: actions/upload-artifact@v7
        with:
          name: performance-report-${{ needs.metrics.outputs.version }}
          path: .benchmarks/artifacts
          retention-days: 7

      - name: Comment results
        uses: actions/github-script@v9
        if: ${{ !env.ACT }}
        with:
          script: |
            const fs = require('fs');
            const version = '${{ needs.metrics.outputs.version }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'benchmark-reference';
            const dir = '.benchmarks/artifacts';
            const plotNames = fs.readdirSync(dir)
              .filter(f => f.startsWith('summary_') && f.endsWith('.png'))
              .sort();
            const plotAlts = {
              [`summary_${version}_run.png`]: 'Run scenarios',
              [`summary_${version}_create_recovery_setstatus.png`]: 'Create / Recovery / Setstatus',
              [`summary_${version}_memory.png`]: 'Memory scenarios',
            };

            const summary = fs.readFileSync(`${dir}/summary_${version}.md`, 'utf8');

            // GitHub strips data: URIs from comment images, so the plots are
            // pushed to the benchmark-reference branch and linked over https.
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (e) {
              if (e.status !== 404) throw e;
              const { data: info } = await github.rest.repos.get({ owner, repo });
              const { data: head } = await github.rest.git.getRef({ owner, repo, ref: `heads/${info.default_branch}` });
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: head.object.sha });
            }

            let old = [];
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: dir, ref: branch });
              old = Array.isArray(data)
                ? data.filter(f => f.name.startsWith('summary_') && f.name.endsWith('.png') && !plotNames.includes(f.name))
                : [];
            } catch (e) { if (e.status !== 404) throw e; }
            for (const f of old) {
              await github.rest.repos.deleteFile({ owner, repo, path: `${dir}/${f.name}`,
                message: `Remove outdated plot ${f.name}`, branch, sha: f.sha });
            }

            for (const pngName of plotNames) {
              const pngPath = `${dir}/${pngName}`;
              const pngB64 = fs.readFileSync(pngPath, { encoding: 'base64' });
              let existingSha;
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: pngPath, ref: branch });
                existingSha = data.sha;
              } catch (e) { if (e.status !== 404) throw e; }
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: pngPath,
                message: `Upload benchmark plot for ${version}`, content: pngB64, branch,
                ...(existingSha ? { sha: existingSha } : {}) });
            }

            const [titleLine, ...restLines] = summary.split('\n');
            const rest = restLines.join('\n').trim();

            // Resolve direct download links for the raw data and the report
            // artifacts, falling back to the run page.
            let dataUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            let reportUrl = dataUrl;
            try {
              const { data: runs } = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: context.runId,
              });
              for (const a of (runs.artifacts || [])) {
                if (a.name === `performance-metrics-${version}`) {
                  dataUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${a.id}`;
                }
                if (a.name === `performance-report-${version}`) {
                  reportUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${a.id}`;
                }
              }
            } catch (e) { /* keep the run page as fallback */ }

            const plotImages = plotNames.map(pngName =>
              `![${plotAlts[pngName] || pngName}](https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${dir}/${pngName})`
            );

            const body = [
              `## Benchmark Results (${{ needs.metrics.outputs.test_type }})`,
              '',
              ...plotImages,
              '',
              titleLine,
              '',
              '<details>',
              '<summary>Click to expand — regressions and scenario tables</summary>',
              '',
              rest,
              '',
              '</details>',
              '',
              `[Download benchmark data](${dataUrl}) · [Download report (md, plots, json)](${reportUrl})`
            ].join('\n');
            const issue_number = Number('${{ needs.metrics.outputs.issue_number }}');
            // Update the existing benchmark comment in place so every run edits
            // the first one instead of posting duplicates.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body.startsWith('## Benchmark Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
            // Remove the progress notice(s) now that the results are in.
            const progress = comments.filter((c) => c.body.startsWith('> **Benchmark status:**'));
            for (const p of progress) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: p.id });
            }

      - name: Display results (ACT)
        if: ${{ env.ACT }}
        run: |
          echo "Benchmark Results (Local Run - ${{ needs.metrics.outputs.test_type }})"
          echo "================================"
          cat .benchmarks/artifacts/summary_${{ needs.metrics.outputs.version }}.md
          echo ""
          echo "Plots saved to .benchmarks/artifacts/summary_${{ needs.metrics.outputs.version }}_run.png"
          echo "             and .benchmarks/artifacts/summary_${{ needs.metrics.outputs.version }}_create_recovery_setstatus.png"
          echo "             and .benchmarks/artifacts/summary_${{ needs.metrics.outputs.version }}_memory.png"

  update-baseline:
    needs: [report, metrics]
    if: >
      always() && needs.metrics.result == 'success' &&
      (
        needs.metrics.outputs.promote_last == 'true' ||
        (needs.report.result == 'success' &&
         needs.report.outputs.regressions_detected == 'false')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find latest benchmark artifact
        id: latest
        if: needs.metrics.outputs.promote_last == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            let arts = [];
            for (let page = 1; page <= 5; page++) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              arts.push(...(data.artifacts || []));
              if (!(data.artifacts && data.artifacts.length === 100)) break;
            }
            const candidates = arts
              .filter(a => a.name.startsWith('performance-metrics-') && a.expired === false)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            if (!candidates.length) throw new Error('No benchmark artifact found to promote. Run /metrics first.');
            const art = candidates[0];
            core.setOutput('artifact_name', art.name);
            core.setOutput('run_head_sha', (art.workflow_run && art.workflow_run.head_sha) || '');
            core.setOutput('run_id', (art.workflow_run && String(art.workflow_run.id)) || '');

      - name: Download benchmark artifacts
        if: needs.metrics.outputs.promote_last != 'true'
        uses: actions/download-artifact@v8
        with:
          name: performance-metrics-${{ needs.metrics.outputs.version }}
          path: artifact

      - name: Download latest benchmark artifact
        if: needs.metrics.outputs.promote_last == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.latest.outputs.artifact_name }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.latest.outputs.run_id }}
          path: artifact

      - name: Verify artifact belongs to this PR
        if: needs.metrics.outputs.promote_last == 'true'
        run: |
          # Newest merged file: legacy artifacts may hold several run files.
          file=$(find artifact/data -name '*.json' -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)
          short_expected=$(echo '${{ needs.metrics.outputs.head_sha }}' | cut -c1-7)
          base=$(basename "$file")
          if [[ "$base" != *"$short_expected"* ]]; then
            echo "::error::Last benchmark artifact ($base) is not from the current PR head ($short_expected). Re-run /metrics (or /metrics_full) before /metrics_promote."
            exit 1
          fi
          echo "Promoting artifact $base (matches PR head $short_expected)"

      - name: Detect benchmark CPU
        id: cpu
        run: |
          # Prefer the CPU detected by the report job (single source of
          # truth). Fall back to reading the artifact only for /metrics_promote,
          # where the report job is skipped.
          slug="${{ needs.report.outputs.cpu_slug }}"
          if [ -z "$slug" ]; then
            file=$(find artifact/data -name '*.json' -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)
            brand=$(jq -r '.machine_info.cpu.brand_raw // ""' "$file" 2>/dev/null || true)
            slug=$(printf '%s' "$brand" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g; s/^-//; s/-$//')
            [ -n "$slug" ] || slug=unknown-cpu
          fi
          echo "cpu_slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Update the benchmark-reference branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote add base "https://github.com/${{ github.repository }}.git"
          git fetch base benchmark-reference --depth 1 || true
          if git rev-parse --verify refs/remotes/base/benchmark-reference >/dev/null 2>&1; then
            git checkout -B benchmark-reference refs/remotes/base/benchmark-reference
          else
            git checkout --orphan benchmark-reference
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p .benchmarks/reference
          ref_dir=".benchmarks/reference/${{ steps.cpu.outputs.cpu_slug }}"
          mkdir -p "$ref_dir"
          new_baseline=$(find artifact/data -name '*.json' -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2- | xargs -r basename)
          [ -n "$new_baseline" ] || { echo "::error::No benchmark file found in artifact/data"; exit 1; }
          cp "artifact/data/$new_baseline" "$ref_dir/$new_baseline"
          find "$ref_dir" -name '*.json' ! -name "$new_baseline" -delete
          git add .benchmarks/reference
          if [ "${{ needs.metrics.outputs.promote_last }}" == "true" ]; then
            label="artifact ${{ steps.latest.outputs.artifact_name }} (${{ steps.latest.outputs.run_head_sha }}) [${{ steps.cpu.outputs.cpu_slug }}]"
          else
            label="${{ needs.metrics.outputs.version }} (${{ needs.metrics.outputs.head_sha }}) [${{ steps.cpu.outputs.cpu_slug }}]"
          fi
          git commit -m "Update benchmark baseline for ${label}" || {
            echo "No changes to commit"
            exit 0
          }
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" benchmark-reference

      - name: Post promotion confirmation
        if: needs.metrics.outputs.promote_last == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const name = '${{ steps.latest.outputs.artifact_name }}';
            const sha = '${{ steps.latest.outputs.run_head_sha }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.metrics.outputs.issue_number }}'),
              body: `Baseline promoted from the last completed benchmark run: \`${name}\`${sha ? ` (head ${sha})` : ''}.`
            });
