[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "autosubmit"
dynamic = ["version", "readme"]
description = "Autosubmit is a Python-based workflow manager to create, manage and monitor complex tasks involving different substeps, such as scientific computational experiments. These workflows may involve multiple computing systems for their completion, from HPCs to post-processing clusters or workstations. Autosubmit can orchestrate all the tasks integrating the workflow by managing their dependencies, interfacing with all the platforms involved, and handling eventual errors."
requires-python = ">=3.10,<3.13"
authors = [
  { name="The Autosubmit Team - Models and Workflows Team (MWT) - Barcelona Supercomputing Center (BSC)", email="support-autosubmit@bsc.es" },
]
maintainers = [
  { name="The Autosubmit Team - Models and Workflows Team (MWT) - Barcelona Supercomputing Center (BSC)", email="support-autosubmit@bsc.es" },
]

keywords = ["climate", "weather", "workflow", "HPC"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux"
]

dependencies = [
    "xlib==0.21",
    "bscearth.utils<=0.5.2",
    "requests<=2.34.2",
    "networkx<=3.6.1",
    "portalocker<=4.1.0",
    "paramiko>=3.5.0",
    "pyparsing==3.3.2",
    "matplotlib<=3.10.9",
    "psutil<=7.2.2",
    "py3dotplus==1.1.0",
    "numpy<3",
    "rocrate==0.15.1",
    "setproctitle",
    "invoke>=2.0",
    "SQLAlchemy~=2.0.23",
    "ruamel.yaml==0.19.1",
    "configobj",
    "configparser"
]

[project.urls]
Homepage = "https://www.bsc.es/projects/earthscience/autosubmit/"
Documentation = "https://autosubmit.readthedocs.io/"
"Download Link" = "https://earth.bsc.es/wiki/doku.php?id=tools:autosubmit"

[project.optional-dependencies]
postgres = ["psycopg", "psycopg2"]
lint = [
    "ruff==0.16.3",
]
tests = [
    # TODO: remove mock by pytest-mock, only test_wrappers is missing to be updated!
    "mock",
    "pytest>=8.2,<9.2",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "testcontainers",
    "pytest-timeout",
    "roc-validator",
    "typing_extensions==4.*",
    "pytest-timestamper"
]
mypy = [
    "mypy",
    "types-docker",
    "types-psutil",
    "types-mock",
    "types-networkx",
    "types-paramiko",
    "types-requests"
]
benchmark = [
    "pandas",
    "matplotlib",
    "tabulate"
]
docs = [
    "livereload",
    "pydata-sphinx-theme>=0.16.1,<0.20",
    "sphinx>=5,<10",
    "sphinx-autobuild>=2021.3,<2025.9",
    "sphinx_rtd_theme",
    "sphinx-reredirects>=0.1,<1.2",
    "sphinx_design",
    "tomli"
]
all = [
    "autosubmit[tests]",
    "autosubmit[mypy]",
    "autosubmit[lint]",
    "autosubmit[docs]",
    "autosubmit[postgres]",
    "autosubmit[benchmark]"
]

[project.scripts]
autosubmit = "autosubmit.scripts.autosubmit:main"

[tool.setuptools]
package-data = { "autosubmit" = [
    "config/files/*.yml",
    "database/data/*.sql",
] }
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "VERSION"}
readme = {file = "README_PIP.md"}

[tool.setuptools.packages.find]
where = ["."]
include = ["autosubmit*"]
namespaces = true

[tool.mypy]
mypy_path = ["."]
namespace_packages = true
explicit_package_bases = false

[[tool.mypy.overrides]]
module = [
    "bscearth.*",
    "configobj.*",
    "integration.*",
    "rocrate.*",
    "rocrate_validator.*",
    "unit.*",
    "test.integration.*",
    "test.unit.*"
]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.ruff.lint]
ignore = [
    "DTZ005",
    "E501",
    "FA102",
    "RUF010"
]

# NOTE: used to inspect dead code from time to time.
# Done on demand, not part of the CI/CD pipeline.
[tool.vulture]
exclude = ["*/build/*", "*/.venv/*", "*/docs/*"]
min_confidence = 70
