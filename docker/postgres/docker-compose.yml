services:
  autosubmit:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        NEW_MAMBA_USER_ID: ${HOST_UID:-1000}
        NEW_MAMBA_USER_GID: ${HOST_GID:-1000}
        # This setting below enables the local editable installation of autosubmit.
        INSTALL_LOCAL_AUTOSUBMIT: "1"

    container_name: autosubmit
    working_dir: /app/

    volumes:
      # The current source code used for development.
      - ../..:/app/
      # Configuration file.
      - ./autosubmitrc:/etc/autosubmitrc:ro
      # Experiment data and other directories.
      - ./experiments:/as/experiments
      - ./database:/as/database
      - ./logs:/as/logs
      - ./metadata:/as/metadata

    environment:
      AUTOSUBMIT_CONFIGURATION: /etc/autosubmitrc
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: autosubmit
      DB_USER: autosubmit
      DB_PASSWORD: autosubmit

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    # Install AS and then keep the container running...
    command:
      - /bin/bash
      - -lc
      - |
        set -e
        eval "$(/bin/micromamba shell hook --shell=bash)"
        micromamba activate base
        python -m pip install --editable /app/
        /app/docker/postgres/setup_directories.sh
        autosubmit install
        exec sleep infinity

  postgres:
    image: postgres:16
    container_name: autosubmit-postgres

    environment:
      POSTGRES_DB: autosubmit
      POSTGRES_USER: autosubmit
      POSTGRES_PASSWORD: autosubmit

    volumes:
      - as_postgres_data:/var/lib/postgresql/data

    ports:
      # Expose PostgreSQL to the host for development tools.
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U autosubmit -d autosubmit" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

volumes:
  as_postgres_data:
