[pytest]
# NOTE: One integration tests group took ~13.5 minutes with --dist loadgroup,
#       against ~12.5 minutes with --dist load.
# -rs is -r with the "s" char: it lists skipped tests and their reasons in the
# short test summary, so an unexpected skip is visible instead of silent.
# Docs: https://docs.pytest.org/en/stable/reference/reference.html#cmdoption-r
#       https://docs.pytest.org/en/stable/how-to/skipping.html
addopts =
    --verbose
    -rs
    --strict-markers
    --doctest-modules
    -n auto --max-worker-restart 0 --dist load
    -m "not docker and not postgres and not slurm and not asprofile and not local and not profile and not benchmark"
    --durations=5
    --failed-first
    --timeout=120

testpaths =
    test/unit
    autosubmit
doctest_optionflags =
    NORMALIZE_WHITESPACE
    IGNORE_EXCEPTION_DETAIL
    ELLIPSIS
markers =
    docker: marks a test that requires docker to run.
    slurm: marks a test that requires a Slurm container to run.
    git: marks a test that requires a Git server to run.
    svn: marks a test that requires a SVN server to run.
    postgres: mark a test that requires postgres to run.
    ssh: marks a test that requires an SSH server.
    x11: marks a test that requires an SSH server with X11 enabled.
    mfa: marks a test that requires an SSH server with MFA enabled.
    local: marks a test that must run locally.
    timeout: marks a test that must be run under a time limit.
    profile: marks a test that uses Autosubmit profiler.
    profilelong: marks a test that uses Autosubmit profiler and is expected to run for a long time.
    docs: marks a test that builds the documentation.
    benchmark: marks a test that creates files to generate the benchmark of AS
