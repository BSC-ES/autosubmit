JOBS:
  GET_FILES:
    SCRIPT: 'sleep 0'
    RUNNING: chunk

  IT:
    SCRIPT: 'sleep 0'
    RUNNING: chunk
    QUEUE: debug

  CALC_STATS:
    SCRIPT: 'sleep 0'
    DEPENDENCIES:
      IT:
      GET_FILES:
        STATUS: FINISHED   # COMPLETED, SKIPPED or FAILED: run after GET_FILES ends, whatever the outcome
    RUNNING: chunk
    SYNCHRONIZE: member
